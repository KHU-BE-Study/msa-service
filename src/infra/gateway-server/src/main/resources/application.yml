server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: gateway-server
  cloud:
    gateway:
      server:
        webflux:
          global cors:
            cors-configurations:
              '[/**]': # 모든 요청에 대해 CORS 적용
                allowedOrigins:

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                exposedHeaders: "*"
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
